openapiOptions:
  file:
    - file: auth/v1/auth.proto
      option:
        info:
          title: go-foundation API
          version: "1.0"
          description: HTTP/JSON API generated from the go-foundation protobuf contracts.
        schemes:
          - HTTP
          - HTTPS
        consumes:
          - application/json
        produces:
          - application/json
        securityDefinitions:
          security:
            BearerAuth:
              type: TYPE_API_KEY
              in: IN_HEADER
              name: Authorization
              description: "Enter a JWT as: Bearer <token>"
        security:
          - securityRequirement:
              BearerAuth: {}
  method:
    - method: auth.v1.AuthService.Login
      option:
        summary: Authenticate with local credentials
        security:
          - securityRequirement: {}
